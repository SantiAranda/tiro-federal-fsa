[project]
name = "tiro-federal-gestion"
version = "0.1.0"
description = "Sistema Web de Gestión y Portal Institucional para el Tiro Federal Formosa"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Santiago Nicolas Aranda" },
    { name = "Lourdes Antonella Bordon Sbardella" },
    { name = "Sofia Antonela Lujan" }
]

dependencies = [
    # Framework Web y Servidor ASGI
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Validación de datos y configuraciones
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",

    # ORM y Persistencia (SQLite)
    "sqlalchemy>=2.0.30",

    # Autenticación, Hashing y Formularios
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # Renderizado y cliente HTTP
    "jinja2>=3.1.4",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",

    # Linter, Formatter y Type Checking ultrarrápidos
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Configuración de Pytest
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

# Configuración de Ruff (Linter y Formatter unificado)
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # Errores, Pyflakes, Isort, PyUpgrade, Bugbear
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Configuración de Type Checking (Mypy)
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true